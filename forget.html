<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forget Password</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/buttons.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box active" id="forget-form">
            <h1>Forget Password</h1>
            <form id="myform" onsubmit="return checkcaptcha()">
                <p>Please enter your email address to reset your password.</p>
                <input type="email" name="email" placeholder="Email/Number" required>
                <div>
                    <p class="auth-verify-msg">Verify You're Not A Robot</p>
                    <div class="auth-recaptcha">
                        <div class="g-recaptcha" data-sitekey="6LdqZeIrAAAAAJbUi-gZ5mIVCUAxaAau7seoE9xL"></div>
                    </div>
                    <p id="verifyMsg">Please complete the captcha to continue.</p>
                    <button type="submit" onclick="showForm('verify-form')">Submit</button>
                </div>
            </form>
        </div>

        <form action="">
            <div class="auth-box" id="verify-form">
                <h4>Verify Your Email</h4>
                <p>Please Enter The verification code we sent to your email</p>
                <input type="text" name="code" placeholder="OTP" maxlength="4" required>
                <p>Please enter your new password.</p>
                <div class="password-wrapper">
                    <input type="password" id="newPass" name="new-password" placeholder="New Password" required maxlength="8">
                    <button type="button" class="toggle-password" id="toggleNewPass" aria-label="Show password" title="Show password">
                        <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="eye-icon eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                            <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                            <line x1="2" y1="2" x2="22" y2="22"></line>
                        </svg>
                    </button>
                </div>
                <button type="submit" name="reset-password">
                    Reset Password
                </button>
                <div class="auth-links">
                    <a href="index.html">Back to Login</a>
                </div>
            </div>
        </form>
    </div>

    <script src="js/forget.js"></script>
</body>
</html>
